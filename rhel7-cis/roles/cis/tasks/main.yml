---
# tasks file for RHEL7-CIS
- name: Check OS version and family
  fail:
      msg: "This role requires a RedHat-family OS with major version 7. Detected {{ ansible_distribution | default('unknown') }} {{ ansible_distribution_major_version | default('unknown') }} (family: {{ ansible_os_family | default('unknown') }})."
  when: (ansible_os_family | default('')) != 'RedHat' or (ansible_distribution_major_version | default('') | string) != '7'
  tags:
      - always

- name: Check ansible version
  fail:
      msg: You must use ansible 2.1 or greater
  when: not ansible_version.full | version_compare('2.1', '>=')
  tags:
      - always

- include: prelim.yml
  become: yes
  tags:
      - prelim_tasks
      - always

- include: section1.yml
  become: yes
  when: rhel7cis_section1

- include: section2.yml
  become: yes
  when: rhel7cis_section2

- include: section3.yml
  become: yes
  when: rhel7cis_section3

- include: section4.yml
  become: yes
  when: rhel7cis_section4

- include: section5.yml
  become: yes
  when: rhel7cis_section5

- include: section6.yml
  become: yes
  when: rhel7cis_section6

- include: post.yml
  become: yes
  tags:
      - post_tasks
      - always
